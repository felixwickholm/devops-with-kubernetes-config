# Production: deployed from tagged commits.
# The broadcaster forwards the messages to the external service, and the database is backed up.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
  - webhook-receiver.yaml
  - backup-cronjob.yaml
patches:
  - path: broadcaster-config.yaml
  - path: backend-config.yaml
images:
  - name: felixwickholm/todo-app
    newTag: "4.8"
  - name: felixwickholm/todo-backend
    newTag: "4.6"
  - name: felixwickholm/broadcaster
    newTag: "4.6"
  - name: felixwickholm/todo-cronjob
    newTag: "2.9"
