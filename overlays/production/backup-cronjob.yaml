# Daily pg_dump of the todo database to a volume. Only production is backed up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backup-claim
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-cronjob
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: db-backup-claim
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["sh", "-c", "pg_dump > /backups/todo-$(date +%Y%m%d-%H%M%S).sql && ls -l /backups"]
              env:
                - name: PGHOST
                  value: todo-postgres-svc
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: todo-postgres-secret
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: todo-postgres-secret
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: todo-postgres-secret
                      key: POSTGRES_DB
              volumeMounts:
                - name: backups
                  mountPath: /backups
