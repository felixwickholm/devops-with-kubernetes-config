apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo-cronjob
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: create-todo
              image: felixwickholm/todo-cronjob:2.9
              env:
                - name: RANDOM_ARTICLE_URL
                  value: https://en.wikipedia.org/wiki/Special:Random
                - name: TODO_BACKEND_URL
                  value: http://todo-backend-svc:2345/todos
